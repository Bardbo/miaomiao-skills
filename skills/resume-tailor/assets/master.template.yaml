#    name: ""
#    period: ""
#    student_era: false          # true = 校园内容，社招画像下自动过滤
#    relevance: normal           # low = 无竞争性荣誉。过滤后若全是 low → 整段不渲染
#    force: false                # true = 本人显式要求保留（投国企/体制内时）
#    evidence: self_reported

certifications: []
